<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自然小學堂・卡牌對戰</title>
<style>
  :root {
    --bg: #1e1f29;
    --panel: #2a2c3a;
    --panel-2: #1c1d27;
    --line: #3f4158;
    --accent: #6c8cff;
    --good: #4caf82;
    --bad: #e0556f;
    --gold: #e0b34f;
    --text: #f1f1f6;
    --muted: #9698ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }
  .shell {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border-radius: 16px;
    padding: 26px 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.desc { color: var(--muted); margin: 0 0 18px; line-height: 1.6; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 1rem; margin-bottom: 8px;
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 8px 14px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button {
    cursor: pointer; border: none; border-radius: 10px; padding: 12px 18px; font-size: 1rem; font-weight: 600;
    font-family: inherit;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 10px; width: 100%; }
  .btn-gold { background: var(--gold); color: #2a2200; width: 100%; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-row .btn-secondary { margin-top: 0; }
  .faction-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: .85rem; font-weight: 700; color: #1c1d27; }
  .turn-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .turn-head .who { font-size: 1.2rem; font-weight: 700; }
  .stats-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .hand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 14px; min-height: 90px; }
  .hand-card { border-radius: 10px; padding: 8px 6px; font-size: .8rem; text-align: center; border: 2px solid var(--line); background: var(--panel-2); line-height: 1.4; }
  .hand-card .score { font-weight: 700; font-size: .95rem; }
  .hand-card .role { color: var(--muted); font-size: .72rem; margin-top: 2px; }
  .breakdown { color: var(--muted); font-size: .85rem; margin: -4px 0 14px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; text-align: center; min-height: 1.2em; }
  .board { display: grid; gap: 6px; margin-bottom: 16px; }
  .board-row { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .board-row.now { border-color: var(--gold); border-width: 2px; }
  .board-row .bar { align-self: stretch; border-radius: 4px; }
  .board-row .meta { color: var(--muted); font-size: .8rem; }
  .board-row .pts { font-size: 1.3rem; font-weight: 700; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .submit-status { color: var(--muted); font-size: .85rem; margin-top: 14px; text-align: center; }
  .best-note { color: var(--muted); font-size: .85rem; margin-top: 8px; text-align: center; }
  .hidden { display: none !important; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal-box { background: var(--panel); border-radius: 14px; padding: 22px; max-width: 440px; width: 100%; border: 1px solid var(--gold); max-height: 90vh; overflow: auto; }
  .modal-box h3 { margin: 0 0 6px; color: var(--gold); }
  .choice-btn { display: block; width: 100%; text-align: left; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: .95rem; }
  .choice-btn.correct { background: rgba(76,175,130,0.2); border-color: var(--good); }
  .choice-btn.wrong { background: rgba(224,85,111,0.2); border-color: var(--bad); }
  .feedback { min-height: 20px; font-size: .9rem; margin: 6px 0 4px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .handover { text-align: center; }
  .handover .big { font-size: 2rem; font-weight: 700; margin: 8px 0 16px; }
</style>
</head>
<body>

<div class="shell">

  <!-- ===== 畫面一:開始畫面(選模式、人數、名字) ===== -->
  <div id="screen-start">
    <h1 id="game-title">🌱 自然小學堂・卡牌對戰</h1>
    <p class="desc" id="game-desc">每位玩家會被分配到一個陣營。輪到你時可以抽卡,抽卡途中會遇到「機會命運」問答,答對加分、答錯扣分;分數夠高還能發動戰鬥!</p>
    <div class="field" id="mode-field">
      <label class="field"><span>遊玩模式</span></label>
      <div class="seg" id="mode-seg"></div>
    </div>
    <div class="field hidden" id="count-field" style="margin-top:14px">
      <label class="field"><span>玩家人數(同一台裝置輪流操作)</span></label>
      <div class="seg" id="count-seg"></div>
    </div>
    <div id="name-inputs" style="margin-top:14px"></div>
    <button class="btn-primary" id="btn-start">開始遊戲</button>
    <div class="best-note" id="best-note"></div>
  </div>

  <!-- ===== 畫面二:遊戲進行中(輪流行動) ===== -->
  <div id="screen-game" class="hidden">
    <div class="board" id="board"></div>
    <div class="turn-head">
      <span class="who" id="turn-who"></span>
      <span class="faction-tag" id="faction-tag"></span>
    </div>
    <div class="stats-row">
      <span id="stat-progress"></span>
      <span id="stat-chance"></span>
    </div>
    <div class="hand-grid" id="hand-grid"></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-draw">抽下一張</button>
      <button class="btn-gold" id="btn-battle">發動戰鬥</button>
    </div>
    <p class="hint" id="turn-hint"></p>
  </div>

  <!-- ===== 畫面三:結算畫面 ===== -->
  <div id="screen-end" class="hidden">
    <h1 id="end-title">🎉 遊戲結束!</h1>
    <div id="end-summary"></div>
    <div class="submit-status" id="submit-status"></div>
    <button class="btn-secondary" id="btn-restart">再玩一次</button>
  </div>

  <!-- ===== 機會命運問答視窗 ===== -->
  <div id="question-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>🎴 機會命運</h3>
      <p id="q-who" style="color:var(--muted);margin:0 0 6px"></p>
      <p id="q-text"></p>
      <div id="q-choices"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>
  </div>

  <!-- ===== 通用視窗:換人、選戰鬥對象、戰鬥結果 ===== -->
  <div id="info-modal" class="modal-overlay hidden">
    <div class="modal-box" id="info-box"></div>
  </div>

</div>

<script>
/* =========================================================
   第一部分:資料與設定 —— 客製化時主要改這裡
   ========================================================= */

/* 1. 陣營 */
const FACTIONS = [
  { key: "red",   label: "朱雀紅族", color: "#e0556f" },
  { key: "blue",  label: "玄武藍族", color: "#5b8def" },
  { key: "white", label: "白虎白族", color: "#cfd3e0" },
  { key: "green", label: "青龍綠族", color: "#4caf82" }
];

/* 2. 卡片身分(role)—— 身分種類由規則決定,可增減。
      計分與戰鬥用到哪些 role,就在第二部分的規則函式裡寫哪些 */
const ROLES = [
  { key: "king",     label: "主君" },
  { key: "beast",    label: "神獸" },
  { key: "noble",    label: "貴族" },
  { key: "commoner", label: "百姓" },
  { key: "poor",     label: "貧民" }
];

/* 3. 卡片資料。role 必須是 ROLES 裡有的 key */
const CARD_POOL = [
  { id: 1,  faction: "red",   role: "king",     name: "紅族主君", baseScore: 15 },
  { id: 2,  faction: "red",   role: "beast",    name: "朱雀",     baseScore: 12 },
  { id: 3,  faction: "red",   role: "noble",    name: "紅族貴族", baseScore: 8 },
  { id: 4,  faction: "red",   role: "commoner", name: "紅族百姓", baseScore: 5 },
  { id: 5,  faction: "red",   role: "poor",     name: "紅族貧民", baseScore: 2 },
  { id: 6,  faction: "blue",  role: "king",     name: "藍族主君", baseScore: 15 },
  { id: 7,  faction: "blue",  role: "beast",    name: "玄武",     baseScore: 12 },
  { id: 8,  faction: "blue",  role: "noble",    name: "藍族貴族", baseScore: 8 },
  { id: 9,  faction: "blue",  role: "commoner", name: "藍族百姓", baseScore: 5 },
  { id: 10, faction: "blue",  role: "poor",     name: "藍族貧民", baseScore: 2 },
  { id: 11, faction: "white", role: "king",     name: "白族主君", baseScore: 15 },
  { id: 12, faction: "white", role: "beast",    name: "白虎",     baseScore: 12 },
  { id: 13, faction: "white", role: "noble",    name: "白族貴族", baseScore: 8 },
  { id: 14, faction: "white", role: "commoner", name: "白族百姓", baseScore: 5 },
  { id: 15, faction: "white", role: "poor",     name: "白族貧民", baseScore: 2 },
  { id: 16, faction: "green", role: "king",     name: "綠族主君", baseScore: 15 },
  { id: 17, faction: "green", role: "beast",    name: "青龍",     baseScore: 12 },
  { id: 18, faction: "green", role: "noble",    name: "綠族貴族", baseScore: 8 },
  { id: 19, faction: "green", role: "commoner", name: "綠族百姓", baseScore: 5 },
  { id: 20, faction: "green", role: "poor",     name: "綠族貧民", baseScore: 2 }
];

/* 4. 機會命運問答卡。correctBonus / wrongPenalty 都填正數 */
const QUESTION_CARDS = [
  // 答對 +5、答錯只扣 1(老師要求答錯不要扣太兇;要調整就改 wrongPenalty)
  { id: 1, question: "植物行光合作用需要什麼氣體?", choices: ["二氧化碳", "氧氣", "氮氣"], answerIndex: 0, correctBonus: 5, wrongPenalty: 1 },
  { id: 2, question: "水在幾度會結冰?", choices: ["0 度", "50 度", "100 度"], answerIndex: 0, correctBonus: 5, wrongPenalty: 1 },
  { id: 3, question: "月亮會自己發光嗎?", choices: ["會", "不會"], answerIndex: 1, correctBonus: 5, wrongPenalty: 1 }
];

/* 5. 遊戲設定 */
const GAME = {
  modes: ["solo"],             // 要提供哪些模式;只留一個就不會顯示模式選擇
  defaultMode: "solo",         // "solo" 單人對電腦 / "hotseat" 多人同一畫面輪流
  minPlayers: 2,               // 多人模式最少幾人
  maxPlayers: 4,               // 多人模式最多幾人
  // 抽卡來源,依模式分開設定:
  //   "shared"     所有人從同一副牌輪流抽
  //   "ownFaction" 只抽自己陣營的卡(陣營卡數 ≤ handSize 時每局都會抽到全部,加成必定觸發,要小心)
  //   "mixed"      自己陣營的卡 + 同樣張數的他陣營卡洗在一起再抽
  drawFrom: { solo: "mixed", hotseat: "shared" },
  handSize: 5,                 // 每位玩家總共抽幾張一般卡片
  questionInterval: 2,         // 每抽幾張一般卡片,穿插一次機會命運問答
  battleThreshold: 30,         // 總分達到多少才能發動戰鬥
  battlesPerPlayer: 1,         // 每位玩家每局最多發動幾次戰鬥
  battleWinBonus: 10,          // 戰鬥勝利加幾分
  shuffleChoices: true         // 問答選項每次打亂順序,避免正確答案總在同一個位置
};

/* 6. Google Apps Script 上傳網址 */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxoaiCAFBtwna1J66zZGkvIQg-Tahz_NrTLj1aT2YyF3FeP-LJ3HOKInrj-M1SLF09bpA/exec";

/* 7. localStorage key(記錄這台裝置的歷史最高分)。多個遊戲共用網域時要改成不同名字 */
const STORAGE_KEY = "science-card-battle-best";


/* =========================================================
   第二部分:規則函式 —— 規則不同時,整個函式可以改寫
   只要維持「輸入、輸出」的形狀,其他程式就不用動
   ========================================================= */

/* R1. 計分:回傳 { total, detail }
   預設範例規則:自己陣營有主君 → 同陣營卡 ×2;主君 + 神獸 → ×3;
   其他陣營的卡照面額;戰鬥輸了會失去主君加成(player.flags.lostKing) */
function scorePlayer(player) {
  const own = player.hand.filter(c => c.faction === player.faction);
  const other = player.hand.filter(c => c.faction !== player.faction);
  const hasKing = !player.flags.lostKing && own.some(c => c.role === "king");
  const hasBeast = own.some(c => c.role === "beast");
  const mult = hasKing && hasBeast ? 3 : hasKing ? 2 : 1;
  const ownSum = own.reduce((s, c) => s + c.baseScore, 0);
  const otherSum = other.reduce((s, c) => s + c.baseScore, 0);
  const total = ownSum * mult + otherSum + player.chanceScoreDelta + player.battleBonus;
  const parts = [`同陣營 ${ownSum}${mult > 1 ? " × " + mult : ""}`, `其他陣營 ${otherSum}`];
  if (player.chanceScoreDelta) parts.push(`機會命運 ${signed(player.chanceScoreDelta)}`);
  if (player.battleBonus) parts.push(`戰鬥 ${signed(player.battleBonus)}`);
  if (player.flags.lostKing) parts.push("已失去主君加成");
  return { total, detail: parts.join(",") + ` = ${total}` };
}

/* R2. 能不能發動戰鬥:可以就回傳 "",不行就回傳原因(會顯示在畫面上) */
function canBattle(player) {
  if (player.battlesUsed >= GAME.battlesPerPlayer) return "本局的戰鬥次數已經用完";
  const total = scorePlayer(player).total;
  if (total < GAME.battleThreshold) return `總分達到 ${GAME.battleThreshold} 分才能發動戰鬥(目前 ${total})`;
  if (state.mode === "hotseat" && battleTargets(player).length === 0) return "沒有可以攻打的對手";
  return "";
}

/* R3. 可以攻打的對象(多人模式)。例如「只能打有主君的人」就在這裡過濾 */
function battleTargets(player) {
  return state.players.filter(p => p !== player);
}

/* R4. 電腦對手分數(單人模式) */
function getNpcScore() {
  return Math.floor(Math.random() * 20) + 25; // 25~44
}

/* R5. 戰鬥結算:defender 為 null 代表單人模式的電腦對手
   直接修改玩家資料(加分、扣分、失去加成…),回傳要顯示的結果文字 */
function resolveBattle(attacker, defender) {
  const a = scorePlayer(attacker).total;
  const d = defender ? scorePlayer(defender).total : getNpcScore();
  const defName = defender ? defender.name : "電腦對手";
  if (a >= d) {
    attacker.battleBonus += GAME.battleWinBonus;
    attacker.battleResult = "win";
    if (defender) { defender.flags.lostKing = true; defender.battleResult = defender.battleResult || "defended-lose"; }
    return `${attacker.name} ${a} 分 對 ${defName} ${d} 分,${attacker.name} 勝利!+${GAME.battleWinBonus} 分` +
      (defender ? `;${defName} 失去主君加成。` : "。");
  }
  attacker.flags.lostKing = true;
  attacker.battleResult = "lose";
  if (defender) defender.battleResult = defender.battleResult || "defended-win";
  return `${attacker.name} ${a} 分 對 ${defName} ${d} 分,戰鬥失敗,${attacker.name} 失去主君加成。`;
}

/* R6. 決定名次(多人模式);預設依總分高低 */
function rankPlayers(players) {
  return players.slice().sort((x, y) => scorePlayer(y).total - scorePlayer(x).total);
}


/* =========================================================
   第三部分:遊戲流程 —— 通常不需要修改
   ========================================================= */

/* 遊戲狀態。每位玩家的資料都在 players 陣列裡。
   規則需要新的玩家欄位(例如籌碼、俘虜)時,在 makePlayer() 裡加。
   要替換既有欄位(例如把 battleResult 換成勝敗場數)也可以,但搜尋整份檔案,
   所有用到它的地方都要一起改,finishGame() 的 payload 和 gas-backend.gs 也要對應 */
let state = {
  mode: GAME.defaultMode,
  playerCount: GAME.minPlayers,
  players: [],
  turn: 0,
  busy: false,       // 問答或視窗開著時為 true,期間鎖住所有行動按鈕
  startTime: null
};

function makePlayer(name, faction) {
  return {
    name, faction,
    drawQueue: [],
    hand: [],
    chanceScoreDelta: 0,
    correctCount: 0,
    wrongCount: 0,
    battleBonus: 0,
    battlesUsed: 0,
    battleResult: null,   // null | "win" | "lose" | "defended-win" | "defended-lose"
    flags: {}             // 規則用的旗標,例如 lostKing
  };
}

const el = (id) => document.getElementById(id);
const getFaction = (key) => FACTIONS.find(f => f.key === key);
const roleLabel = (key) => (ROLES.find(r => r.key === key) || { label: key }).label;
const signed = (n) => (n >= 0 ? "+" : "") + n;
const cur = () => state.players[state.turn];
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadBest() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function saveBestIfNeeded(score, name) {
  const best = loadBest();
  if (!best || score > best.score) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ score, name })); } catch (e) {}
  }
}
function showBestNote() {
  const best = loadBest();
  el("best-note").textContent = best ? `這台裝置的最高分:${best.score} 分${best.name ? "(" + best.name + ")" : ""}` : "";
}

/* ---------- 開始畫面 ---------- */
function renderSetup() {
  const modeLabel = { solo: "單人(對電腦)", hotseat: "多人(同一畫面輪流)" };
  el("mode-field").classList.toggle("hidden", GAME.modes.length < 2);
  el("mode-seg").innerHTML = GAME.modes.map(m =>
    `<button type="button" data-mode="${m}" aria-pressed="${state.mode === m}">${modeLabel[m]}</button>`).join("");
  el("count-field").classList.toggle("hidden", state.mode !== "hotseat");
  const counts = [];
  for (let n = GAME.minPlayers; n <= GAME.maxPlayers; n++) counts.push(n);
  el("count-seg").innerHTML = counts.map(n =>
    `<button type="button" data-count="${n}" aria-pressed="${state.playerCount === n}">${n} 人</button>`).join("");
  const n = state.mode === "hotseat" ? state.playerCount : 1;
  const old = [...document.querySelectorAll("#name-inputs input")].map(i => i.value);
  let html = `<label class="field"><span>${n > 1 ? "玩家名稱(可留空)" : "姓名或暱稱"}</span>`;
  for (let i = 0; i < n; i++) {
    html += `<input type="text" data-name="${i}" placeholder="${n > 1 ? "第 " + (i + 1) + " 位玩家" : "請輸入姓名或暱稱"}" value="${escapeHtml(old[i] || "")}">`;
  }
  el("name-inputs").innerHTML = html + "</label>";
}

/* ---------- 分配陣營、組抽卡佇列 ---------- */
function assignFactions(n) {
  // 人數不超過陣營數時每人不同陣營;超過時會重複
  const order = shuffle(FACTIONS.map(f => f.key));
  return Array.from({ length: n }, (_, i) => order[i % order.length]);
}

/* 依 handSize / questionInterval 為每位玩家組出抽卡佇列。
   佇列裡每一項是 { type: "card", data } 或 { type: "question", data } */
function buildDrawDeck() {
  const questions = shuffle(QUESTION_CARDS);
  let qIndex = 0;
  const shared = shuffle(CARD_POOL);
  state.players.forEach((p, pi) => {
    let cards;
    const source = typeof GAME.drawFrom === "string" ? GAME.drawFrom : GAME.drawFrom[state.mode];
    if (source === "ownFaction") {
      cards = shuffle(CARD_POOL.filter(c => c.faction === p.faction)).slice(0, GAME.handSize);
    } else if (source === "mixed") {
      const own = CARD_POOL.filter(c => c.faction === p.faction);
      const others = shuffle(CARD_POOL.filter(c => c.faction !== p.faction)).slice(0, own.length);
      cards = shuffle(own.concat(others)).slice(0, GAME.handSize);
    } else {
      cards = [];
      for (let k = 0; k < GAME.handSize; k++) {
        const c = shared[k * state.players.length + pi];
        if (c) cards.push(c);
      }
    }
    const queue = [];
    cards.forEach((card, i) => {
      queue.push({ type: "card", data: card });
      if ((i + 1) % GAME.questionInterval === 0 && questions.length) {
        queue.push({ type: "question", data: questions[qIndex % questions.length] });
        qIndex++;
      }
    });
    p.drawQueue = queue;
  });
}

function startGame() {
  const n = state.mode === "hotseat" ? state.playerCount : 1;
  const names = [...document.querySelectorAll("#name-inputs input")].map(i => i.value.trim());
  const factions = assignFactions(n);
  state.players = factions.map((f, i) => makePlayer(names[i] || (n > 1 ? `玩家${i + 1}` : "玩家"), f));
  state.turn = 0;
  state.busy = false;
  state.startTime = Date.now();
  buildDrawDeck();

  el("screen-start").classList.add("hidden");
  el("screen-game").classList.remove("hidden");
  renderGame();

  if (state.mode === "hotseat") {
    const lines = state.players.map(p =>
      `<div class="summary-row"><span>${escapeHtml(p.name)}</span><span class="faction-tag" style="background:${getFaction(p.faction).color}">${getFaction(p.faction).label}</span></div>`).join("");
    showInfo(`<h3>陣營分配</h3>${lines}`, [{ label: "開始", primary: true }]).then(showHandover);
  }
}

/* ---------- 畫面 ---------- */
function renderGame() {
  const p = cur();
  const f = getFaction(p.faction);
  const sc = scorePlayer(p);

  // 多人模式的記分板
  el("board").classList.toggle("hidden", state.mode !== "hotseat");
  el("board").innerHTML = state.players.map((o, i) => {
    const left = o.drawQueue.filter(x => x.type === "card").length;
    return `<div class="board-row ${i === state.turn ? "now" : ""}">
      <span class="bar" style="background:${getFaction(o.faction).color}"></span>
      <div><div>${escapeHtml(o.name)}</div><div class="meta">${getFaction(o.faction).label},還有 ${left} 張可抽</div></div>
      <span class="pts">${scorePlayer(o).total}</span></div>`;
  }).join("");

  el("turn-who").textContent = state.mode === "hotseat" ? `輪到 ${p.name}` : p.name;
  const tag = el("faction-tag");
  tag.textContent = f.label;
  tag.style.background = f.color;

  const drawn = p.hand.length;
  const total = drawn + p.drawQueue.filter(x => x.type === "card").length;
  el("stat-progress").textContent = `已抽卡:${drawn} / ${total}`;
  el("stat-chance").textContent = `機會命運加減分:${signed(p.chanceScoreDelta)}`;

  el("hand-grid").innerHTML = p.hand.map(card => {
    const cf = getFaction(card.faction);
    return `<div class="hand-card" style="border-color:${cf ? cf.color : "var(--line)"}">
      <div class="score">${card.baseScore} 分</div><div>${escapeHtml(card.name)}</div><div class="role">${roleLabel(card.role)}</div></div>`;
  }).join("");
  el("breakdown").textContent = `目前總分:${sc.detail}`;

  const noDraw = p.drawQueue.length === 0;
  const block = canBattle(p);
  el("btn-draw").textContent = noDraw ? "已經抽完" : "抽下一張";
  el("btn-draw").disabled = state.busy || noDraw;
  el("btn-battle").disabled = state.busy || !!block;
  el("turn-hint").textContent = block ? `戰鬥:${block}` : "分數已達門檻,這回合可以選擇發動戰鬥。";
}

/* ---------- 通用視窗 ---------- */
function showInfo(html, buttons) {
  state.busy = true;
  renderGameIfVisible();
  return new Promise(resolve => {
    el("info-box").innerHTML = html + `<div style="display:grid;gap:8px;margin-top:14px">` +
      buttons.map((b, i) => `<button type="button" data-info="${i}" class="${b.primary ? "btn-primary" : b.gold ? "btn-gold" : "btn-secondary"}" style="margin:0">${escapeHtml(b.label)}</button>`).join("") + `</div>`;
    el("info-modal").classList.remove("hidden");
    el("info-box").querySelectorAll("[data-info]").forEach(btn => {
      btn.addEventListener("click", () => {
        el("info-modal").classList.add("hidden");
        state.busy = false;
        renderGameIfVisible();
        resolve(buttons[+btn.dataset.info].value);
      });
    });
    const first = el("info-box").querySelector(".btn-primary") || el("info-box").querySelector("button");
    if (first) first.focus();
  });
}
function renderGameIfVisible() {
  if (!el("screen-game").classList.contains("hidden") && state.players.length) renderGame();
}
function showHandover() {
  if (state.mode !== "hotseat") return Promise.resolve();
  const p = cur();
  return showInfo(`<div class="handover"><div style="color:var(--muted)">請把裝置交給</div>
    <div class="big" style="color:${getFaction(p.faction).color}">${escapeHtml(p.name)}</div></div>`,
    [{ label: "我準備好了", primary: true }]);
}

/* ---------- 行動:抽卡 ----------
   問答視窗開著的時候 state.busy = true,抽卡與戰鬥按鈕都會被鎖住,不要拿掉這個鎖定 */
function drawNext() {
  if (state.busy) return;
  const p = cur();
  if (p.drawQueue.length === 0) return;
  const item = p.drawQueue.shift();
  if (item.type === "card") {
    p.hand.push(item.data);
    renderGame();
    endTurn();
  } else {
    showQuestionModal(item.data);
  }
}

function showQuestionModal(q) {
  state.busy = true;
  renderGame();
  el("q-who").textContent = state.mode === "hotseat" ? `由 ${cur().name} 作答` : "";
  el("q-text").textContent = q.question;
  el("q-feedback").textContent = "";
  el("q-feedback").className = "feedback";
  const wrap = el("q-choices");
  wrap.innerHTML = "";
  // i 永遠是原本 choices 裡的索引,打亂的只是顯示順序,所以 answerIndex 不用改
  const order = q.choices.map((_, i) => i);
  const shown = GAME.shuffleChoices ? shuffle(order) : order;
  shown.forEach(i => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = q.choices[i];
    btn.addEventListener("click", () => answerQuestion(i, q, btn));
    wrap.appendChild(btn);
  });
  el("question-modal").classList.remove("hidden");
}

function answerQuestion(choiceIndex, q, btnEl) {
  const p = cur();
  document.querySelectorAll("#q-choices .choice-btn").forEach(b => b.disabled = true);
  if (choiceIndex === q.answerIndex) {
    p.correctCount++;
    p.chanceScoreDelta += q.correctBonus;
    btnEl.classList.add("correct");
    el("q-feedback").textContent = `答對了!+${q.correctBonus} 分`;
    el("q-feedback").className = "feedback good";
  } else {
    p.wrongCount++;
    p.chanceScoreDelta -= q.wrongPenalty;
    btnEl.classList.add("wrong");
    el("q-feedback").textContent = `答錯了,-${q.wrongPenalty} 分(正確答案:${q.choices[q.answerIndex]})`;
    el("q-feedback").className = "feedback bad";
  }
  setTimeout(() => {
    el("question-modal").classList.add("hidden");
    state.busy = false;
    renderGame();
    endTurn();
  }, 1200);
}

/* ---------- 行動:戰鬥 ---------- */
async function startBattle() {
  if (state.busy) return;
  const p = cur();
  if (canBattle(p)) return;
  let target = null;
  if (state.mode === "hotseat") {
    const options = battleTargets(p).map(o => ({ label: `${o.name}(${getFaction(o.faction).label},${scorePlayer(o).total} 分)`, value: o, gold: true }));
    target = await showInfo(`<h3>要攻打誰?</h3>`, [...options, { label: "取消", value: null }]);
    if (!target) return;
  }
  p.battlesUsed++;
  const msg = resolveBattle(p, target);
  await showInfo(`<h3>戰鬥結果</h3><p>${escapeHtml(msg)}</p>`, [{ label: "繼續", primary: true }]);
  endTurn();
}

/* ---------- 換人與結束 ---------- */
function endTurn() {
  if (state.players.every(p => p.drawQueue.length === 0)) {
    finishGame();
    return;
  }
  if (state.mode === "hotseat") {
    // 跳過已經抽完的玩家
    do { state.turn = (state.turn + 1) % state.players.length; } while (cur().drawQueue.length === 0);
    renderGame();
    showHandover();
  } else {
    renderGame();
  }
}

function finishGame() {
  el("screen-game").classList.add("hidden");
  el("screen-end").classList.remove("hidden");
  const durationSec = Math.round((Date.now() - state.startTime) / 1000);
  const ranked = rankPlayers(state.players);
  const battleLabel = { win: "主動出擊獲勝", lose: "主動出擊失敗", "defended-win": "守住了", "defended-lose": "被擊敗" };

  let html = "";
  ranked.forEach((p, i) => {
    const sc = scorePlayer(p);
    html += `<h2 style="margin-top:${i ? 18 : 6}px">${ranked.length > 1 ? `第 ${i + 1} 名:` : ""}${escapeHtml(p.name)}</h2>
      <div class="summary-row"><span>陣營</span><span>${getFaction(p.faction).label}</span></div>
      <div class="summary-row"><span>計分</span><span>${escapeHtml(sc.detail)}</span></div>
      <div class="summary-row"><span>答對/答錯</span><span>${p.correctCount} / ${p.wrongCount}</span></div>
      <div class="summary-row"><span>戰鬥</span><span>${battleLabel[p.battleResult] || "沒有戰鬥"}</span></div>
      <div class="summary-row"><span>最終分數</span><span><b>${sc.total} 分</b></span></div>`;
  });
  el("end-title").textContent = ranked.length > 1 ? `🏆 ${ranked[0].name} 獲勝!` : "🎉 遊戲結束!";
  el("end-summary").innerHTML = html;

  saveBestIfNeeded(scorePlayer(ranked[0]).total, ranked[0].name);

  /* 上傳資料:一局一筆,players 陣列裡每位玩家一項。
     要記錄哪些欄位由使用者決定,加欄位時 gas-backend.gs 的 appendRow 也要對應 */
  const payload = {
    mode: state.mode,
    playerCount: state.players.length,
    durationSec: durationSec,
    players: ranked.map((p, i) => ({
      rank: i + 1,
      playerName: p.name,
      faction: getFaction(p.faction).label,
      finalScore: scorePlayer(p).total,
      correctCount: p.correctCount,
      wrongCount: p.wrongCount,
      battleResult: p.battleResult || "none"
    }))
  };
  sendResultsToSheet(payload);
}

/* ---------- 送資料到 Google Apps Script ---------- */
function sendResultsToSheet(payload) {
  const statusEl = el("submit-status");
  if (!GAS_URL || GAS_URL.indexOf("PASTE_YOUR") === 0) {
    statusEl.textContent = "(尚未設定 Google 試算表網址,成績只顯示在畫面上)";
    return;
  }
  statusEl.textContent = "成績上傳中...";
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(() => {
    statusEl.textContent = "成績已送出 ✅";
  }).catch(() => {
    statusEl.textContent = "送出失敗,請檢查網路連線";
  });
}

/* ---------- 初始化與事件綁定 ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; renderSetup(); }
  if (b.dataset.count) { state.playerCount = +b.dataset.count; renderSetup(); }
});
el("btn-start").addEventListener("click", startGame);
el("btn-draw").addEventListener("click", drawNext);
el("btn-battle").addEventListener("click", startBattle);
el("btn-restart").addEventListener("click", () => {
  el("screen-end").classList.add("hidden");
  el("screen-start").classList.remove("hidden");
  el("submit-status").textContent = "";
  renderSetup();
  showBestNote();
});

if (!GAME.modes.includes(state.mode)) state.mode = GAME.modes[0];
renderSetup();
showBestNote();
</script>
